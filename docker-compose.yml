# Local development: infrastructure plus the Go services. The OCR service is added when it exists.
x-service: &service
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 5
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: braillebar
    ports:
      - "127.0.0.1:5433:5432" # 5433 on the host so it does not clash with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braillebar"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    <<: *service
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080" # the only service the apps talk to
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=gateway
      DOCUMENT_SERVICE_URL: http://document-service:8080
      PRINT_JOB_SERVICE_URL: http://print-job-service:8080

  document-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: document-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=document

  layout-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: layout-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=layout
      DOCUMENT_SERVICE_URL: http://document-service:8080
      CELLS_PER_LINE: ${CELLS_PER_LINE:-30}
      LINES_PER_PAGE: ${LINES_PER_PAGE:-17}

  print-job-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: print-job-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=print_job

  notification-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

volumes:
  pgdata:
