# Local development: infrastructure plus the services.
x-service: &service
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 5
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: braillebar
    ports:
      - "127.0.0.1:5433:5432" # 5433 on the host so it does not clash with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braillebar"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    <<: *service
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080" # the only service the apps talk to
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=gateway
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL}
      PRINT_JOB_SERVICE_URL: ${PRINT_JOB_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

  document-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: document-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=document
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}

  layout-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: layout-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=layout
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      DOCUMENT_SERVICE_URL: http://document-service:8080
      CELLS_PER_LINE: ${CELLS_PER_LINE:-30}
      LINES_PER_PAGE: ${LINES_PER_PAGE:-17}

  print-job-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: print-job-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/braillebar?search_path=print_job
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}

  notification-service:
    <<: *service
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

  ocr-service: # scale with --scale ocr-service=N
    build: ./backend/ocr-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      DOCUMENT_SERVICE_URL: http://document-service:8080

  jaeger: # traces UI: http://localhost:16686
    image: jaegertracing/all-in-one:1.60
    environment:
      MEMORY_MAX_TRACES: 5000
    ports:
      - "127.0.0.1:16686:16686"

  k6: # only runs on request: docker compose run --rm k6
    image: grafana/k6:1.0.0
    profiles: [tools]
    command: run /scripts/load-test.js
    environment:
      BASE: http://gateway:8080
    volumes:
      - ./scripts:/scripts:ro

volumes:
  pgdata:
